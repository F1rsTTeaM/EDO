name: Backend build

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - name: Write CI time to summary
        if: always()
        run: |
          DURATION=$SECONDS
          echo "## Время CI" >> $GITHUB_STEP_SUMMARY
          echo "- Общее время job: ${DURATION}с" >> $GITHUB_STEP_SUMMARY

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/*.jar
          retention-days: 30
      - name: Write CI time to summary
        if: always()
        run: |
          DURATION=$SECONDS
          echo "## Время CI" >> $GITHUB_STEP_SUMMARY
          echo "- Общее время job: ${DURATION}с" >> $GITHUB_STEP_SUMMARY