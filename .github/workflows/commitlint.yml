name: Commitlint
on:
  pull_request:
  push:
    branches: ['**']

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

      - name: Write CI time to summary
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "## Время CI" >> $GITHUB_STEP_SUMMARY
          echo "- Общее время job: ${DURATION}с" >> $GITHUB_STEP_SUMMARY