name: Backend lint

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Checkstyle and SpotBugs
        run: mvn -B verify -DskipTests

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: backend/target/checkstyle-result.xml

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: backend/target/spotbugsXml.xml

      - name: Write metrics to summary
        if: always()
        working-directory: backend
        run: |
          echo "## Метрики качества бэкенда" >> $GITHUB_STEP_SUMMARY

          if [ -f target/checkstyle-result.xml ]; then
            CHECKSTYLE=$(grep -c '<error' target/checkstyle-result.xml || echo 0)
            echo "- Checkstyle: $CHECKSTYLE замечаний" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f target/spotbugsXml.xml ]; then
            SPOTBUGS=$(grep -c '<BugInstance' target/spotbugsXml.xml || echo 0)
            echo "- SpotBugs: $SPOTBUGS замечаний" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Write CI time to summary
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "## Время CI" >> $GITHUB_STEP_SUMMARY
          echo "- Общее время job: ${DURATION}с" >> $GITHUB_STEP_SUMMARY