name: Backend test

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests with coverage
        run: mvn -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Write coverage to summary
        if: always()
        working-directory: backend
        run: |
          echo "## Покрытие кода" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {mi+=$4; ci+=$5} END {printf "Line coverage: %.1f%%\n", ci*100/(mi+ci)}' \
              target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          else
            echo "Отчёт JaCoCo не найден" >> $GITHUB_STEP_SUMMARY
          fi