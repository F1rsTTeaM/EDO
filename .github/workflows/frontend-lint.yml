name: Frontend lint

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint with JSON output
        run: npx eslint . -f json -o eslint-report.json || true

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: frontend/eslint-report.json

      - name: Write ESLint metrics to summary
        if: always()
        run: |
          echo "## Метрики качества фронтенда" >> $GITHUB_STEP_SUMMARY
          if [ -f eslint-report.json ]; then
            ERRORS=$(jq '[.[].errorCount] | add' eslint-report.json)
            WARNINGS=$(jq '[.[].warningCount] | add' eslint-report.json)
            echo "- ESLint: $ERRORS ошибок, $WARNINGS предупреждений" >> $GITHUB_STEP_SUMMARY
          fi